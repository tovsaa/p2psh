name: container

# Build and publish the server image to GitHub Container Registry.
# Image tags:
#   - main          (rolling, latest commit on main)
#   - v1.2.3        (when you push a git tag like v1.2.3)
#   - latest        (alias for the most recent semver tag)
#   - sha-abcdef    (commit SHA, always)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Trivy uploads results as a SARIF artifact and (when on push to main) to
  # GitHub Security tab; both need `security-events: write`.
  security-events: write

env:
  REGISTRY: ghcr.io
  # Resolves to ghcr.io/tovsaa/p2psh (lowercased automatically).
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=latest
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only for now; arm64 needs a hand-built nym-client (see README).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CVE scan the freshly-published image. We don't fail the build on
      # findings (severity threshold is left to the SARIF reviewer) — the goal
      # is visibility, not gating, since some Debian-base CVEs sit unfixed
      # for months and would block every push.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
