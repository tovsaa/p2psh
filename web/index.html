<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P2PSH — browser client</title>
    <style>
      :root { color-scheme: dark light; }
      body { font: 14px/1.45 system-ui, sans-serif; max-width: 880px; margin: 2em auto; padding: 0 1em; }
      h1 { font-size: 1.4em; margin-bottom: 0.2em; }
      .sub { color: #888; margin-top: 0; }
      label { display: block; margin-top: 0.8em; font-weight: 600; }
      input, textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: 12px; padding: 0.4em; }
      textarea { min-height: 4em; resize: vertical; }
      button { margin-top: 1em; padding: 0.6em 1.2em; font-size: 14px; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #log { background: #111; color: #ddd; padding: 0.8em; margin-top: 1em; font-family: ui-monospace, monospace; font-size: 12px; min-height: 6em; max-height: 12em; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
      #term { margin-top: 1em; height: 24em; background: #000; padding: 0.4em; }
      #term .xterm { height: 100%; }
      .row { display: flex; gap: 0.8em; }
      .row > * { flex: 1; }
    </style>
  </head>
  <body>
    <h1>P2PSH — browser client</h1>
    <p class="sub">Paste the three values printed by <code>npm run server</code> in WSL, then click Connect.</p>

    <label for="connect">Connect string (paste the <code>p2psh1://…</code> the server printed)</label>
    <textarea id="connect" spellcheck="false" autocapitalize="off" placeholder="p2psh1://…"></textarea>

    <button id="go">Connect</button>

    <div id="log"></div>
    <div id="term"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
